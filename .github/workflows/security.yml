# Secret scanning (gitleaks) and workflow linting (zizmor).
# Free substitutes for GitHub secret scanning / code scanning, which are not
# available on private repos owned by a personal account.
name: Security

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 9 * * 1" # weekly full-history scan, Monday 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.2
          GITLEAKS_SHA256: fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # PRs scan only their own commits; pushes and the weekly run scan full history.
          # Reviewed historical findings are listed by fingerprint in .gitleaksignore.
          if [ "$EVENT" = "pull_request" ]; then
            /tmp/gitleaks git . --redact --no-banner --log-opts="${BASE_SHA}..HEAD"
          else
            /tmp/gitleaks git . --redact --no-banner
          fi

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: pipx run zizmor==1.31.1 --offline --min-severity high .github/workflows
