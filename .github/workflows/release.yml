# Publish to PyPI when a version tag (v0.2.0) is pushed. Uses PyPI trusted
# publishing: no token is stored anywhere. It does nothing until the
# signal-chain-generator project on PyPI names this repository, this workflow
# file and the "pypi" environment as a trusted publisher.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write  # trusted publishing to PyPI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.11.32
      - name: Test
        run: uv run --locked --extra dev pytest -q
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run --locked python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "Tag $TAG doesn't match version $version in pyproject.toml"; exit 1; }
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish --trusted-publishing always

  # The signed, notarized Mac app, attached to the GitHub release. Signing
  # secrets live only in the protected "macos-release" environment.
  mac-app:
    needs: publish
    runs-on: macos-latest
    timeout-minutes: 45
    environment: macos-release
    permissions:
      contents: write  # attach the .dmg to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$identity" || { echo "No Developer ID Application identity in the certificate"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        env:
          TAG: ${{ github.ref_name }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          bash scripts/build-mac-app.sh "${TAG#v}"
          rm "$ASC_KEY_PATH"
      - name: Attach to the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes || gh release view "$TAG" >/dev/null  # the Mac and Windows jobs may race
          gh release upload "$TAG" dist/macos/*.dmg --clobber

  # The Windows installer (unsigned for now), attached to the GitHub release.
  windows-installer:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write  # attach the installer to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/build-windows-installer.ps1 $env:TAG.TrimStart("v")
      - name: Attach to the release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes || gh release view "$TAG" >/dev/null  # the Mac and Windows jobs may race
          gh release upload "$TAG" dist/windows/*-Setup.exe --clobber
