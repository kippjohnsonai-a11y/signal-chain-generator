[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signal-chain-generator"
version = "0.1.0"
description = "Type a song, pick a guitar, get a dialled-in HX Stomp XL preset - pushed straight to the pedal."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # uvicorn's WebSocket support: the pedal relayed from a phone or laptop.
    "websockets>=13",
    "pyyaml>=6.0",
    # Talking to the pedal over USB. pyusb also loads the libusb shared library
    # at runtime: `brew install libusb`.
    "pyusb>=1.2.1",
    "msgpack>=1.0.5",
    "pyjwt[crypto]>=2.8",
    "segno>=1.6.6",
]

[project.optional-dependencies]
# HelixGen's OpenAI and Ollama backends still work; OpenAI is only needed if
# you choose that backend in the vendored helixgen CLI.
openai = ["openai>=1.0"]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "ruff==0.17.1",
]

[project.scripts]
signal-chain-generator = "stompxl.__main__:main"
# The original command, kept so existing installs and services keep working.
stompxl = "stompxl.__main__:main"
# The vendored HelixGen CLI: backups, pulling slots, catalog listings.
helixgen = "stompxl.helixgen.cli:main"

[project.urls]
Homepage = "https://github.com/kippjohnsonai-a11y/signal-chain-generator"
Issues = "https://github.com/kippjohnsonai-a11y/signal-chain-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["stompxl"]

[tool.hatch.build.targets.sdist]
# The source release leaves out this repository's CI files.
exclude = [".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
